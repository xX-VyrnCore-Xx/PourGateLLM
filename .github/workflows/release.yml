name: Release
on:
  push:
    tags: ['v*']
  # Manual run: creates the vX.Y.Z tag and release itself (useful when tags cannot be pushed).
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.1.0)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Invalid version: $VERSION" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle
        run: |
          set -e
          VERSION="${{ steps.v.outputs.version }}"
          mkdir -p dist-release/pourgatellm
          cp -r packages/server/dist dist-release/pourgatellm/dist
          cp -r packages/client/dist dist-release/pourgatellm/public
          cp -r registry evals examples docs dist-release/pourgatellm/
          cp README.md LICENSE .env.example dist-release/pourgatellm/
          tar -czf "pourgatellm-${VERSION}.tar.gz" -C dist-release pourgatellm
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: pourgatellm-*.tar.gz

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [verify, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.verify.outputs.version }}"
          # The release may already exist (created from the GitHub UI): then just attach the bundle.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" pourgatellm-*.tar.gz --clobber
          else
            # --target only matters when the tag does not exist yet (manual run): it is created at this commit.
            gh release create "$TAG" pourgatellm-*.tar.gz \
              --title "PourGateLLM $TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
