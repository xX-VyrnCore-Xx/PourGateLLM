name: Desktop
# Experimental: compiles the Tauri wrapper. Not a required check.
on:
  workflow_dispatch:
  pull_request:
    paths: ['packages/desktop/**', '.github/workflows/desktop.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @pourgate/desktop prepare:server
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build --no-bundle
        working-directory: packages/desktop/src-tauri
