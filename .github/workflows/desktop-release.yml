name: Desktop release
# Builds the Windows installers (MSI + NSIS) and the macOS app (DMG, Apple Silicon) and attaches them to an existing release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release to attach to, without the leading v (e.g. 0.1.0)'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp the release version into the app
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          node -e "const f='packages/desktop/src-tauri/tauri.conf.json';const fs=require('fs');const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          POURGATE_VERSION: ${{ inputs.version }}
      - name: Prepare the app with its own Node.js runtime
        run: pnpm --filter @pourgate/desktop prepare:server:standalone
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build
        working-directory: packages/desktop/src-tauri
      - name: Attach installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          cd packages/desktop/src-tauri/target/release/bundle
          for f in msi/*.msi nsis/*.exe; do
            cp "$f" "PourGateLLM-${VERSION}-windows-$(basename "$f")"
          done
          sha256sum PourGateLLM-*.msi PourGateLLM-*.exe > SHA256SUMS-windows-app.txt
          gh release upload "v$VERSION" PourGateLLM-*.msi PourGateLLM-*.exe SHA256SUMS-windows-app.txt --clobber --repo "$GITHUB_REPOSITORY"
      - name: Attest the installers build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            packages/desktop/src-tauri/target/release/bundle/PourGateLLM-*.msi
            packages/desktop/src-tauri/target/release/bundle/PourGateLLM-*.exe

  macos:
    # Unsigned, ad-hoc signed build: macOS asks you to confirm the first launch (right-click > Open).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp the release version and the macOS icon set into the app
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          node -e "const f='packages/desktop/src-tauri/tauri.conf.json';const fs=require('fs');const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version=process.env.VERSION;c.bundle.icon=[...c.bundle.icon,'icons/icon.icns'];fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          POURGATE_VERSION: ${{ inputs.version }}
      - name: Prepare the app with its own Node.js runtime
        run: pnpm --filter @pourgate/desktop prepare:server:standalone
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Generate the .icns icon
        run: cargo tauri icon icons/icon.png --output icons
        working-directory: packages/desktop/src-tauri
      - run: cargo tauri build --bundles app,dmg
        working-directory: packages/desktop/src-tauri
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - name: Attach the DMG to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          cd packages/desktop/src-tauri/target/release/bundle
          for f in dmg/*.dmg; do
            cp "$f" "PourGateLLM-${VERSION}-macos-$(basename "$f")"
          done
          shasum -a 256 PourGateLLM-*.dmg > SHA256SUMS-macos-app.txt
          gh release upload "v$VERSION" PourGateLLM-*.dmg SHA256SUMS-macos-app.txt --clobber --repo "$GITHUB_REPOSITORY"
      - name: Attest the DMG build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: packages/desktop/src-tauri/target/release/bundle/PourGateLLM-*.dmg
