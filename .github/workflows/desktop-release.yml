name: Desktop release
# Builds the Windows installers (MSI + NSIS) and attaches them to an existing release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release to attach to, without the leading v (e.g. 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Stamp the release version into the app
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          node -e "const f='packages/desktop/src-tauri/tauri.conf.json';const fs=require('fs');const c=JSON.parse(fs.readFileSync(f,'utf8'));c.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @pourgate/desktop prepare:server
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build
        working-directory: packages/desktop/src-tauri
      - name: Attach installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          cd packages/desktop/src-tauri/target/release/bundle
          for f in msi/*.msi nsis/*.exe; do
            cp "$f" "PourGateLLM-${VERSION}-windows-$(basename "$f")"
          done
          gh release upload "v$VERSION" PourGateLLM-*.msi PourGateLLM-*.exe --clobber --repo "$GITHUB_REPOSITORY"
