# CodeQL settings for the repository.
query-filters:
  # `js/insufficient-password-hash` flags createHash('sha256') in packages/server/src/tokens.ts because the value comes
  # from a request header. Those values are not passwords: they are API tokens generated by the gateway from 24 random
  # bytes (192 bits of entropy), which cannot be brute-forced offline, so a fast hash is the right tool (a slow
  # password KDF would only add latency to every API request). The gateway stores no user-chosen passwords: the admin
  # password is compared in constant time against the operator's own configuration. Revisit if that ever changes.
  - exclude:
      id: js/insufficient-password-hash
