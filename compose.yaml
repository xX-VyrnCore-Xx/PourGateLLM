services:
  pourgate:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - pourgate-data:/app/data
      # Plugins (see docs/PLUGINS.md); create ./plugins first:
      # - ./plugins:/app/plugins:ro
volumes:
  pourgate-data:
