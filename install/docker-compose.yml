# PourGateLLM from the published image (no build needed).
#   docker compose up -d
# Pin a version with POURGATE_IMAGE_TAG=0.1.1 in .env or the shell.
services:
  pourgate:
    image: ghcr.io/xx-vyrncore-xx/pourgatellm:${POURGATE_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
    # Published on this machine only. To reach it from other machines set POURGATE_BIND=0.0.0.0 (and put HTTPS in front).
    ports:
      - "${POURGATE_BIND:-127.0.0.1}:${PORT:-3000}:3000"
    # Hardening: no extra privileges, no Linux capabilities (the app needs none).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Stricter still (untested here): read_only: true plus tmpfs: [/tmp]
    volumes:
      - pourgate-data:/app/data
volumes:
  pourgate-data:
