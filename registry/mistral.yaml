# Unverified: model ids and limits must be checked against the provider docs before relying on them.
provider: mistral
base_url: https://api.mistral.ai/v1
api_key_env: MISTRAL_API_KEYS
signup_url: https://console.mistral.ai/api-keys
models:
  - id: mistral-small-latest
    tier: medium
    family: mistral-small
    capabilities: [chat, tools, json_mode]
  - id: open-mistral-nemo
    tier: small
    family: mistral-nemo
    capabilities: [chat, tools, json_mode]
  - id: mistral-embed
    family: mistral-embed
    capabilities: [embeddings]
