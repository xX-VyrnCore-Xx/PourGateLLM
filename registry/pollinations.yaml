# Generated by `pourgate registry discover`: the models pollinations itself marks as free.
# Limits are left empty (learned from the provider's own headers at runtime) unless its free tier documents one.
# Re-run the command to refresh; `registry check` reports ids that disappear.
provider: pollinations
base_url: https://text.pollinations.ai/v1
api_key_env: POLLINATIONS_API_KEYS
auth: bearer
signup_url: https://pollinations.ai
keyless: true
models:
  - id: openai-fast
    tier: medium
    capabilities:
      - chat
    limits: {}
    quirks: []
    verified_at: 2026-10-15
